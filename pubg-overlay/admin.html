<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header>
  <nav id="tabs">
    <button data-a="tab" data-v="live">Jonli</button>
    <button data-a="tab" data-v="teams">Jamoalar</button>
    <button data-a="tab" data-v="map">Xarita</button>
    <button data-a="tab" data-v="results">Natijalar</button>
    <button data-a="tab" data-v="settings">Sozlamalar</button>
  </nav>
  <div class="grow"></div>
  <span id="who" class="st ok" hidden></span>
  <span id="clock">00:00</span>
  <button data-a="undo" id="undo" title="Ctrl+Z">↶ Bekor qilish</button>
  <span id="status" class="st">…</span>
</header>
<main id="main"></main>
<div id="login" hidden>
  <form id="loginForm">
    <h2>Admin kirish</h2>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Parol (kamida 6 belgi)" minlength="6" required>
    <button class="pri">Kirish</button>
    <button type="button" id="signUp">Ro'yxatdan o'tish</button>
    <p class="hint">Birinchi ro'yxatdan o'tgan hisob admin bo'ladi.</p>
    <p id="loginErr"></p>
  </form>
</div>
<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/store.js"></script>
<script src="js/export.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
